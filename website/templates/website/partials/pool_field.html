<div class="field {% if f.errors %}err{% endif %}">
  <label class="block text-sm font-semibold text-slate-700 mb-1.5" for="{{ f.id_for_label }}"><span>{{ f.label }}</span>{% if f.field.required %}<span aria-hidden="true"> *</span>{% else %} <span class="text-slate-400 font-normal">(optional)</span>{% endif %}</label>
  {{ f }}
  {% if hint %}<p class="text-xs text-slate-400 mt-1.5">{{ hint }}</p>{% endif %}
  {% if f.errors %}<p class="text-xs text-red-600 mt-1">{{ f.errors|join:", " }}</p>{% endif %}
</div>
